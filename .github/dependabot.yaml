version: 2

multi-ecosystem-groups:
  dependencies:
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/apps/site"
      - "/apps/platform"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    # Nuxt と vue-tsc が TypeScript 7 に未対応なので、7 系へは上げない。
    ignore:
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
