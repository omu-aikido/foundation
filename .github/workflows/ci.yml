name: CI

permissions:
  contents: read

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run generate-types:site
      - run: vp run generate-types:server
      - run: vp check
      - run: vp run typecheck:site
      - run: vp run typecheck:platform
      - run: vp run test:site
      - run: vp run test:platform
      - run: vp run knip
      - name: Build Site with Nuxt/Nitro
        run: vp run build:site
      - name: Build Platform Worker locally
        run: vp run build:platform

  release-note:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun run scripts/platform/check-release-note.ts
        env:
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
