name: CI

permissions:
  contents: read

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699
        with:
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run generate-types:site
      - run: vp run generate-types:server
      - run: vp check
      - run: vp run typecheck:site
      - run: vp run typecheck:platform
      - run: vp run test:site
      - run: vp run test:platform
      - run: vp run knip
      - name: Build Site with Nuxt/Nitro
        run: vp run build:site
      - name: Build Platform Worker locally
        run: vp run build:platform
